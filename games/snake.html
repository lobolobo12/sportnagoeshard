<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a14" />
<title>SNAKE</title>
<style>
  :root {
    --bg: #0a0a14;
    --grid: #14142b;
    --text: #ffffff;
    --muted: #888aa0;
    --snake: #00e676;
    --head: #69f0ae;
    --food: #ff1744;
    --accent: #00e5ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }

  #game {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at top, #1a1a3a 0%, #0a0a14 60%, #000 100%);
    display: flex; flex-direction: column;
    align-items: center;
    padding: 70px 16px 16px;
  }

  .top {
    position: absolute;
    top: env(safe-area-inset-top, 12px);
    left: 0; right: 0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat.right { align-items: flex-end; }
  .stat .label { font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .stat .value { font-size: 1.4rem; font-weight: 800; line-height: 1; }
  .value.score { color: var(--snake); text-shadow: 0 0 12px currentColor; }

  canvas {
    background: var(--grid);
    border-radius: 14px;
    box-shadow: 0 0 40px rgba(0,230,118,0.15);
    max-width: 100%;
    max-height: 60vh;
    touch-action: none;
  }

  .hint {
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(4px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20; padding: 24px; text-align: center;
    transition: opacity 0.25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-size: clamp(2.8rem, 13vw, 4.8rem);
    font-weight: 900; letter-spacing: -2px; margin: 0;
    background: linear-gradient(135deg, var(--snake), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 0.9;
  }
  .tagline {
    color: var(--muted); margin: 12px 0 24px;
    font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase;
  }
  .btn {
    background: linear-gradient(135deg, var(--snake), var(--accent));
    color: #000; border: none; padding: 14px 40px;
    border-radius: 60px; font-size: 1.1rem; font-weight: 900;
    cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
    box-shadow: 0 8px 30px rgba(0,230,118,0.4);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.95); }
  .back-btn {
    background: rgba(0,0,0,0.6); color: var(--muted);
    border: 1px solid #2a2a44; padding: 6px 14px;
    border-radius: 16px; font-size: 0.7rem; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    text-decoration: none; margin-top: 12px;
  }
  .go-stats {
    margin: 16px 0 22px;
    display: flex; gap: 28px;
  }
  .go-stats .l { color: var(--muted); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; }
  .go-stats .v { font-size: 2.2rem; font-weight: 900; }
  .new-best { color: var(--snake); font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase; animation: pulse 0.8s infinite alternate; margin-bottom: 8px; }
  @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="game">
  <div class="top">
    <div class="stat">
      <div class="label">Score</div>
      <div class="value score" id="score">0</div>
    </div>
    <div class="stat right">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>
  </div>
  <canvas id="board"></canvas>
  <div class="hint">SWIPE TO TURN</div>

  <div class="overlay" id="start">
    <h1 class="title">SNAKE</h1>
    <div class="tagline">swipe · eat · grow · don't crash</div>
    <button class="btn" id="start-btn">START</button>
    <a href="../index.html" class="back-btn">← Hub</a>
  </div>

  <div class="overlay hidden" id="gameover">
    <h1 class="title" style="font-size: clamp(1.8rem, 8vw, 3rem);">GAME<br/>OVER</h1>
    <div class="new-best hidden" id="new-best">NEW BEST</div>
    <div class="go-stats">
      <div><div class="l">Length</div><div class="v" id="go-score">0</div></div>
      <div><div class="l">Best</div><div class="v" id="go-best" style="color: var(--accent);">0</div></div>
    </div>
    <button class="btn" id="retry-btn">TRY AGAIN</button>
    <a href="../index.html" class="back-btn">← Hub</a>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('start');
  const gameoverOverlay = document.getElementById('gameover');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const goScoreEl = document.getElementById('go-score');
  const goBestEl = document.getElementById('go-best');
  const newBestEl = document.getElementById('new-best');

  const COLS = 17, ROWS = 22;
  let cellSize = 18;
  let snake, dir, nextDir, food, score, alive, lastTick, tickInterval;

  function fitCanvas() {
    const maxW = Math.min(window.innerWidth - 32, 380);
    const maxH = window.innerHeight * 0.6;
    const cellW = Math.floor(maxW / COLS);
    const cellH = Math.floor(maxH / ROWS);
    cellSize = Math.max(10, Math.min(cellW, cellH));
    canvas.width = COLS * cellSize;
    canvas.height = ROWS * cellSize;
  }

  function audio(freq, duration=0.1, type='sine', vol=0.1) {
    try {
      const c = audio.ctx || (audio.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + duration);
    } catch(e) {}
  }
  function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

  function placeFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function reset() {
    snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    scoreEl.textContent = 0;
    bestEl.textContent = +(localStorage.getItem('snake_best') || 0);
    placeFood();
    alive = true;
    tickInterval = 140;
    lastTick = performance.now();
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      audio(800, 0.08, 'square', 0.1);
      vibrate(15);
      placeFood();
      tickInterval = Math.max(70, tickInterval - 2);
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = '#14142b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid lines (subtle)
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i*cellSize, 0); ctx.lineTo(i*cellSize, canvas.height); ctx.stroke();
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.beginPath(); ctx.moveTo(0, i*cellSize); ctx.lineTo(canvas.width, i*cellSize); ctx.stroke();
    }

    // food
    ctx.fillStyle = '#ff1744';
    ctx.shadowColor = '#ff1744';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(food.x * cellSize + cellSize/2, food.y * cellSize + cellSize/2, cellSize/2 - 2, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // snake
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#69f0ae' : '#00e676';
      ctx.shadowColor = '#00e676';
      ctx.shadowBlur = i === 0 ? 14 : 6;
      const r = 4;
      const x = s.x * cellSize + 1, y = s.y * cellSize + 1, w = cellSize - 2, h = cellSize - 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function loop(t) {
    if (!alive) return;
    if (t - lastTick >= tickInterval) {
      lastTick = t;
      step();
    }
    if (alive) draw();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    alive = false;
    audio(200, 0.3, 'sawtooth', 0.15);
    setTimeout(() => audio(100, 0.4, 'sawtooth', 0.13), 100);
    vibrate([80, 60, 120]);
    const best = +(localStorage.getItem('snake_best') || 0);
    const isNew = score > best;
    if (isNew) localStorage.setItem('snake_best', score);
    goScoreEl.textContent = score;
    goBestEl.textContent = isNew ? score : best;
    newBestEl.classList.toggle('hidden', !isNew);
    setTimeout(() => gameoverOverlay.classList.remove('hidden'), 400);
    const runs = +(localStorage.getItem('snake_runs') || 0) + 1;
    localStorage.setItem('snake_runs', runs);
  }

  function start() {
    fitCanvas();
    reset();
    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function setDir(x, y) {
    if (snake.length > 1 && dir.x === -x && dir.y === -y) return;
    nextDir = {x, y};
  }

  // Swipe controls
  let touchX = 0, touchY = 0, touching = false;
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    touchX = t.clientX; touchY = t.clientY;
    touching = true;
  }, {passive: false});
  canvas.addEventListener('touchmove', (e) => {
    if (!touching) return;
    e.preventDefault();
    const t = e.touches[0];
    const dx = t.clientX - touchX;
    const dy = t.clientY - touchY;
    if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
      touching = false;
    }
  }, {passive: false});
  canvas.addEventListener('touchend', () => { touching = false; });

  // Keyboard for desktop
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w') setDir(0, -1);
    else if (e.key === 'ArrowDown' || e.key === 's') setDir(0, 1);
    else if (e.key === 'ArrowLeft' || e.key === 'a') setDir(-1, 0);
    else if (e.key === 'ArrowRight' || e.key === 'd') setDir(1, 0);
  });

  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);
  window.addEventListener('resize', fitCanvas);

  bestEl.textContent = +(localStorage.getItem('snake_best') || 0);
  fitCanvas();
  draw.call(null);
})();
</script>
</body>
</html>
