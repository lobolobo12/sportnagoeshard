<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f4ede0" />
<title>FLAPPY · 鳥</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;700;800&family=Yuji+Boku&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f4ede0;
    --paper-2: #ece4d1;
    --paper-3: #e0d5bb;
    --ink: #1c1a16;
    --ink-soft: #3a352d;
    --faded: #8a7e6a;
    --rust: #c84a1d;
    --stamp-red: #b32d23;
    --mustard: #c69a2a;
    --rule: rgba(28,26,22,0.18);
    --f-display: 'RocknRoll One', system-ui, sans-serif;
    --f-mincho: 'Shippori Mincho', serif;
    --f-jp: 'Noto Sans JP', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', monospace;
    --f-brush: 'Yuji Boku', serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: var(--f-jp);
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 100; background: repeating-linear-gradient(0deg, rgba(28,26,22,0.04) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 101; background: radial-gradient(ellipse at center, transparent 55%, rgba(28,26,22,0.18) 100%); }

  #game { position: absolute; inset: 0; cursor: pointer; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }

  .top {
    position: absolute;
    top: env(safe-area-inset-top, 14px);
    left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 5;
    pointer-events: none;
  }
  .score-big {
    font-family: var(--f-display);
    font-size: 3.2rem;
    color: var(--ink);
    line-height: 1;
    text-shadow: 2px 2px 0 var(--paper);
  }
  .best-tag {
    margin-top: 4px;
    font-family: var(--f-mono);
    color: var(--ink-soft);
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }
  .best-tag .kanji { font-family: var(--f-brush); color: var(--rust); margin-right: 4px; }

  .hint {
    position: absolute;
    bottom: 100px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--f-mono);
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
    pointer-events: none;
    animation: hint-pulse 1.2s infinite alternate;
  }
  .hint.hidden { display: none; }
  .hint .kanji { font-family: var(--f-brush); font-size: 14px; margin: 0 6px; color: var(--rust); }
  @keyframes hint-pulse { from { opacity: 0.4; } to { opacity: 1; } }

  .overlay {
    position: absolute; inset: 0;
    background: var(--paper);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20; padding: 24px; text-align: center;
    transition: opacity 0.25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title-jp { font-family: var(--f-jp); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.32em; color: var(--faded); margin: 0 0 4px; }
  .title-en {
    font-family: var(--f-display);
    font-size: clamp(2.6rem, 12vw, 4rem);
    line-height: 0.9; color: var(--ink);
    margin: 0 0 8px; letter-spacing: -0.01em;
  }
  .title-en .kanji { font-family: var(--f-brush); color: var(--stamp-red); font-size: 0.8em; margin-left: 0.15em; }
  .tag-line { font-family: var(--f-mincho); font-style: italic; color: var(--ink-soft); font-size: 0.95rem; margin: 6px 0 24px; max-width: 280px; }
  .btn { background: var(--rust); color: var(--paper); border: none; padding: 12px 36px; font-family: var(--f-display); font-size: 1.1rem; letter-spacing: 0.16em; text-transform: uppercase; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; transition: transform 0.1s; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .back-btn { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--ink); padding: 5px 12px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; margin-top: 14px; display: inline-block; }
  .go-receipt { border: 1px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 14px 18px; margin: 16px 0 20px; background: var(--paper); min-width: 240px; }
  .go-receipt .row { display: flex; align-items: baseline; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); line-height: 2; }
  .go-receipt .leader { flex: 1; border-bottom: 1px dotted var(--rule); margin: 0 8px; transform: translateY(-3px); }
  .go-receipt .val { font-weight: 700; color: var(--ink); font-size: 14px; }
  .new-best { color: var(--stamp-red); font-family: var(--f-display); font-size: 12px; letter-spacing: 0.3em; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div class="top">
    <div class="score-big" id="score">0</div>
    <div class="best-tag"><span class="kanji">記</span>BEST · <span id="best">0</span></div>
  </div>
  <div class="hint" id="hint"><span class="kanji">押</span>TAP TO FLAP</div>

  <div class="overlay" id="start">
    <div class="title-jp">フラッピー · NO. 07</div>
    <h1 class="title-en">FLAPPY<span class="kanji">鳥</span></h1>
    <div class="tag-line">tap to flap · don't kiss the torii · mind the ground.</div>
    <button class="btn" id="start-btn">START</button>
    <a href="../index.html" class="back-btn">← HUB</a>
  </div>

  <div class="overlay hidden" id="gameover">
    <div class="title-jp" style="color: var(--stamp-red);">落 · DROPPED</div>
    <h1 class="title-en" style="font-size: clamp(2rem, 9vw, 3rem);">FALLEN<span class="kanji" style="color:var(--stamp-red);">落</span></h1>
    <div class="new-best hidden" id="new-best">★ NEW BEST</div>
    <div class="go-receipt">
      <div class="row"><span>Score</span><span class="leader"></span><span class="val" id="go-score">0</span></div>
      <div class="row"><span>Best</span><span class="leader"></span><span class="val" id="go-best" style="color: var(--rust);">0</span></div>
    </div>
    <button class="btn" id="retry-btn">TRY AGAIN</button>
    <a href="../index.html" class="back-btn">← HUB</a>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  const gameEl = document.getElementById('game');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('start');
  const gameoverOverlay = document.getElementById('gameover');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const goScoreEl = document.getElementById('go-score');
  const goBestEl = document.getElementById('go-best');
  const newBestEl = document.getElementById('new-best');
  const hintEl = document.getElementById('hint');

  let W, H, ground = 80;
  let bird, pipes, score, alive, lastFrame, lastPipeX;
  const GRAVITY = 0.0014;
  const FLAP = -0.55;
  const PIPE_W = 64;
  const PIPE_SPEED = 0.22;

  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function audio(freq, duration=0.08, type='sine', vol=0.1) { if(localStorage.getItem("settings_mute")==="1")return;
    try {
      const c = audio.ctx || (audio.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = c.createOscillator(); const gain = c.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + duration);
    } catch(e) {}
  }
  function vibrate(ms) { if(localStorage.getItem("settings_haptic_off")==="1")return; if (navigator.vibrate) navigator.vibrate(ms); }

  function reset() {
    bird = { x: W * 0.28, y: H / 2, vy: 0, r: 16, rot: 0 };
    pipes = []; lastPipeX = W;
    score = 0;
    scoreEl.textContent = 0;
    bestEl.textContent = +(localStorage.getItem('flappy_best') || 0);
    alive = true;
    lastFrame = performance.now();
  }

  function spawnPipe(x) {
    const gap = Math.max(140, 200 - Math.min(60, score * 2));
    const minTop = 60;
    const maxTop = H - ground - gap - 60;
    const top = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x, top, gap, passed: false });
  }

  function flap() {
    if (!alive) return;
    bird.vy = FLAP;
    audio(700, 0.06, 'sine', 0.1);
    vibrate(10);
    hintEl.classList.add('hidden');
  }

  function loop(t) {
    const dt = Math.min(50, t - lastFrame);
    lastFrame = t;

    if (alive) {
      bird.vy += GRAVITY * dt;
      bird.y += bird.vy * dt;
      bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy * 1.2));

      if (bird.y + bird.r > H - ground) { bird.y = H - ground - bird.r; return gameOver(); }
      if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }

      for (const p of pipes) {
        p.x -= PIPE_SPEED * dt;
        if (!p.passed && p.x + PIPE_W < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          audio(1000, 0.08, 'square', 0.12);
          vibrate(12);
        }
        if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
          if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + p.gap) return gameOver();
        }
      }
      pipes = pipes.filter(p => p.x + PIPE_W > -10);

      lastPipeX -= PIPE_SPEED * dt;
      if (W - lastPipeX > 220) {
        lastPipeX = W;
        spawnPipe(W);
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  function draw() {
    // sky — paper gradient (cream above, slightly warmer below)
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#f4ede0');
    grad.addColorStop(1, '#e0d5bb');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // faint cloud strokes (mincho-ish)
    ctx.strokeStyle = 'rgba(28,26,22,0.06)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const cy = 60 + i * 90 + ((Date.now() / 100) % H);
      const cyMod = cy % (H - ground);
      ctx.beginPath();
      ctx.moveTo(0, cyMod);
      ctx.lineTo(W, cyMod);
      ctx.stroke();
    }

    // pipes (rust torii style)
    for (const p of pipes) {
      // post bodies
      ctx.fillStyle = '#c84a1d';
      ctx.fillRect(p.x, 0, PIPE_W, p.top);
      ctx.fillRect(p.x, p.top + p.gap, PIPE_W, H - ground - (p.top + p.gap));
      // ink outlines
      ctx.strokeStyle = '#1c1a16';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(p.x + 0.75, 0, PIPE_W - 1.5, p.top);
      ctx.strokeRect(p.x + 0.75, p.top + p.gap, PIPE_W - 1.5, H - ground - (p.top + p.gap));
      // torii top caps (kasagi)
      ctx.fillStyle = '#9a3514';
      ctx.fillRect(p.x - 8, p.top - 12, PIPE_W + 16, 8);
      ctx.fillRect(p.x - 8, p.top + p.gap + 4, PIPE_W + 16, 8);
      ctx.strokeRect(p.x - 8 + 0.75, p.top - 12, PIPE_W + 16 - 1.5, 8);
      ctx.strokeRect(p.x - 8 + 0.75, p.top + p.gap + 4, PIPE_W + 16 - 1.5, 8);
    }

    // ground (ink line + paper-3 strip)
    ctx.fillStyle = '#e0d5bb';
    ctx.fillRect(0, H - ground, W, ground);
    ctx.strokeStyle = '#1c1a16';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, H - ground);
    ctx.lineTo(W, H - ground);
    ctx.stroke();
    // ground dashes
    ctx.strokeStyle = 'rgba(28,26,22,0.18)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(0, H - ground + 14);
    ctx.lineTo(W, H - ground + 14);
    ctx.stroke();
    ctx.setLineDash([]);

    // bird (mustard circle, ink outline)
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    ctx.fillStyle = '#c69a2a';
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1c1a16';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // eye
    ctx.fillStyle = '#1c1a16';
    ctx.beginPath();
    ctx.arc(6, -4, 2.5, 0, Math.PI * 2);
    ctx.fill();
    // beak
    ctx.fillStyle = '#c84a1d';
    ctx.strokeStyle = '#1c1a16';
    ctx.beginPath();
    ctx.moveTo(bird.r - 2, 0);
    ctx.lineTo(bird.r + 8, -3);
    ctx.lineTo(bird.r + 8, 3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function gameOver() {
    if (!alive) return;
    alive = false;
    audio(150, 0.4, 'sawtooth', 0.18);
    setTimeout(() => audio(80, 0.4, 'sawtooth', 0.15), 150);
    vibrate([80, 60, 120]);
    const best = +(localStorage.getItem('flappy_best') || 0);
    const isNew = score > best;
    if (isNew) localStorage.setItem('flappy_best', score);
    goScoreEl.textContent = score;
    goBestEl.textContent = isNew ? score : best;
    newBestEl.classList.toggle('hidden', !isNew);
    const runs = +(localStorage.getItem('flappy_runs') || 0) + 1;
    localStorage.setItem('flappy_runs', runs);
    setTimeout(() => gameoverOverlay.classList.remove('hidden'), 400);
  }

  function start() {
    fit(); reset();
    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    hintEl.classList.remove('hidden');
    requestAnimationFrame(loop);
  }

  gameEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.overlay') || e.target.closest('.back-btn') || e.target.closest('.btn')) return;
    flap();
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); flap(); }
  });
  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);
  window.addEventListener('resize', fit);
  bestEl.textContent = +(localStorage.getItem('flappy_best') || 0);
  fit();
})();
</script>
</body>
</html>
