<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f4ede0" />
<title>WHACK · 叩</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;700;800&family=Yuji+Boku&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f4ede0;
    --paper-2: #ece4d1;
    --paper-3: #e0d5bb;
    --ink: #1c1a16;
    --ink-soft: #3a352d;
    --faded: #8a7e6a;
    --rust: #c84a1d;
    --stamp-red: #b32d23;
    --mustard: #c69a2a;
    --olive: #6b6a3a;
    --teal: #2f6a6a;
    --rule: rgba(28,26,22,0.18);
    --f-display: 'RocknRoll One', system-ui, sans-serif;
    --f-mincho: 'Shippori Mincho', serif;
    --f-jp: 'Noto Sans JP', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', monospace;
    --f-brush: 'Yuji Boku', serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: var(--f-jp);
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 100; background: repeating-linear-gradient(0deg, rgba(28,26,22,0.04) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 101; background: radial-gradient(ellipse at center, transparent 55%, rgba(28,26,22,0.18) 100%); }

  #game {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at top, var(--paper) 0%, var(--paper-2) 100%);
    display: flex; flex-direction: column;
    align-items: center;
  }

  .top {
    position: absolute;
    top: env(safe-area-inset-top, 14px);
    left: 0; right: 0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
  }
  .stat { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.22em; color: var(--ink-soft); text-transform: uppercase; }
  .stat.right { text-align: right; }
  .stat .v { display: block; font-family: var(--f-mono); font-weight: 700; color: var(--ink); font-size: 1.6rem; letter-spacing: 0; line-height: 1; margin-top: 2px; }
  .stat .v.score { color: var(--rust); }
  .stat .v.time { color: var(--stamp-red); }
  .stat .v.time.warn { animation: time-warn 0.5s infinite alternate; }
  @keyframes time-warn {
    from { opacity: 1; }
    to { opacity: 0.4; }
  }

  .grid-wrap {
    margin-top: 90px;
    padding: 14px;
    border: 1.5px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    background: var(--paper);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    width: min(80vw, 320px);
    height: min(80vw, 320px);
  }
  .hole {
    background: var(--paper-3);
    border: 1.5px solid var(--ink);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
  }
  .hole::before {
    content: '';
    position: absolute;
    bottom: 0; left: 10%; right: 10%;
    height: 30%;
    background: var(--ink);
    border-radius: 50% 50% 0 0;
    opacity: 0.85;
  }
  .mole {
    position: absolute;
    width: 70%;
    height: 70%;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    bottom: 25%;
    left: 15%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--f-display);
    font-size: 0.9rem;
    color: var(--paper);
    animation: mole-pop 0.18s ease-out;
    pointer-events: none;
  }
  @keyframes mole-pop {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .mole.regular { background: var(--olive); }
  .mole.golden { background: var(--mustard); color: var(--ink); border-color: var(--rust); }
  .mole.bomb { background: var(--stamp-red); }
  .mole.whacked {
    animation: whack 0.22s ease-out forwards;
  }
  @keyframes whack {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(1.8); opacity: 0; }
  }

  .popup {
    position: absolute;
    font-family: var(--f-display);
    font-size: 1.1rem;
    font-weight: 700;
    pointer-events: none;
    animation: float-up 0.7s ease-out forwards;
    z-index: 5;
    letter-spacing: 0.04em;
  }
  @keyframes float-up {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-40px); opacity: 0; }
  }

  .legend {
    margin-top: 18px;
    display: flex;
    gap: 14px;
    font-family: var(--f-mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .legend .item { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--ink); }
  .legend .dot.r { background: var(--olive); }
  .legend .dot.g { background: var(--mustard); }
  .legend .dot.b { background: var(--stamp-red); }

  .overlay {
    position: absolute; inset: 0;
    background: var(--paper);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20; padding: 24px; text-align: center;
    transition: opacity 0.25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title-jp { font-family: var(--f-jp); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.32em; color: var(--faded); margin: 0 0 4px; }
  .title-en {
    font-family: var(--f-display);
    font-size: clamp(2.6rem, 12vw, 4rem);
    line-height: 0.9; color: var(--ink);
    margin: 0 0 8px; letter-spacing: -0.01em;
  }
  .title-en .kanji { font-family: var(--f-brush); color: var(--stamp-red); font-size: 0.8em; margin-left: 0.15em; }
  .tag-line { font-family: var(--f-mincho); font-style: italic; color: var(--ink-soft); font-size: 0.95rem; margin: 6px 0 18px; max-width: 280px; }
  .rules { color: var(--ink-soft); font-size: 0.85rem; max-width: 280px; margin: 0 0 20px; font-family: var(--f-mincho); }
  .btn { background: var(--rust); color: var(--paper); border: none; padding: 12px 36px; font-family: var(--f-display); font-size: 1.1rem; letter-spacing: 0.16em; text-transform: uppercase; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; transition: transform 0.1s; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .back-btn { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--ink); padding: 5px 12px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; margin-top: 14px; display: inline-block; }
  .go-receipt { border: 1px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 14px 18px; margin: 16px 0 20px; background: var(--paper); min-width: 240px; }
  .go-receipt .row { display: flex; align-items: baseline; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); line-height: 2; }
  .go-receipt .leader { flex: 1; border-bottom: 1px dotted var(--rule); margin: 0 8px; transform: translateY(-3px); }
  .go-receipt .val { font-weight: 700; color: var(--ink); font-size: 14px; }
  .new-best { color: var(--stamp-red); font-family: var(--f-display); font-size: 12px; letter-spacing: 0.3em; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="game">
  <div class="top">
    <div class="stat">
      <span>SCORE</span>
      <span class="v score" id="score">0</span>
    </div>
    <div class="stat right">
      <span>TIME</span>
      <span class="v time" id="time">60</span>
    </div>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="legend">
    <div class="item"><span class="dot r"></span> +1</div>
    <div class="item"><span class="dot g"></span> +3 GOLD</div>
    <div class="item"><span class="dot b"></span> −2 BOMB</div>
  </div>

  <div class="overlay" id="start">
    <div class="title-jp">モグラ · NO. 08</div>
    <h1 class="title-en">WHACK<span class="kanji">叩</span></h1>
    <div class="tag-line">60 seconds. tap fast. avoid bombs.</div>
    <div class="rules">Moles pop out of holes. Tap them to score. Golden = +3, bomb = −2.</div>
    <button class="btn" id="start-btn">START</button>
    <a href="../index.html" class="back-btn">← HUB</a>
  </div>

  <div class="overlay hidden" id="gameover">
    <div class="title-jp" style="color: var(--stamp-red);">終 · TIME UP</div>
    <h1 class="title-en" style="font-size: clamp(2rem, 9vw, 3rem);">TIME UP<span class="kanji" style="color: var(--stamp-red);">終</span></h1>
    <div class="new-best hidden" id="new-best">★ NEW BEST</div>
    <div class="go-receipt">
      <div class="row"><span>Score</span><span class="leader"></span><span class="val" id="go-score">0</span></div>
      <div class="row"><span>Best</span><span class="leader"></span><span class="val" id="go-best" style="color: var(--rust);">0</span></div>
    </div>
    <button class="btn" id="retry-btn">TRY AGAIN</button>
    <a href="../index.html" class="back-btn">← HUB</a>
  </div>
</div>

<script>
(() => {
  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const startOverlay = document.getElementById('start');
  const gameoverOverlay = document.getElementById('gameover');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const goScoreEl = document.getElementById('go-score');
  const goBestEl = document.getElementById('go-best');
  const newBestEl = document.getElementById('new-best');

  const HOLES = 9;
  const GAME_LENGTH = 60_000;
  const holes = [];

  function audio(freq, duration=0.08, type='sine', vol=0.1) {
    try {
      const c = audio.ctx || (audio.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = c.createOscillator(); const gain = c.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + duration);
    } catch(e) {}
  }
  function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

  let score = 0;
  let alive = false;
  let startedAt = 0;
  let lastSpawn = 0;
  let spawnInterval = 700;
  let moles = []; // {idx, type, until, el}

  // build grid
  for (let i = 0; i < HOLES; i++) {
    const h = document.createElement('div');
    h.className = 'hole';
    h.dataset.idx = i;
    h.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      onHit(i);
    });
    gridEl.appendChild(h);
    holes.push(h);
  }

  function spawnMole() {
    const occupied = new Set(moles.map(m => m.idx));
    const free = [];
    for (let i = 0; i < HOLES; i++) if (!occupied.has(i)) free.push(i);
    if (!free.length) return;
    const idx = free[Math.floor(Math.random() * free.length)];
    const roll = Math.random();
    let type, duration;
    if (roll < 0.10) { type = 'bomb'; duration = 1300; }
    else if (roll < 0.22) { type = 'golden'; duration = 700; }
    else { type = 'regular'; duration = 1100; }

    const el = document.createElement('div');
    el.className = 'mole ' + type;
    el.textContent = type === 'bomb' ? 'X' : type === 'golden' ? '★' : '•';
    holes[idx].appendChild(el);
    moles.push({ idx, type, until: performance.now() + duration, el });
  }

  function popup(text, idx, color) {
    const hole = holes[idx];
    const el = document.createElement('div');
    el.className = 'popup';
    el.textContent = text;
    el.style.color = color;
    el.style.left = '50%';
    el.style.top = '20%';
    el.style.transform = 'translateX(-50%)';
    hole.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }

  function onHit(idx) {
    if (!alive) return;
    const mole = moles.find(m => m.idx === idx);
    if (!mole) {
      // missed (tapped empty hole) — small wasted-action sound, no penalty
      audio(180, 0.05, 'square', 0.06);
      vibrate(8);
      return;
    }
    mole.el.classList.add('whacked');
    setTimeout(() => mole.el.remove(), 220);
    moles = moles.filter(m => m.idx !== idx);

    if (mole.type === 'bomb') {
      score = Math.max(0, score - 2);
      audio(140, 0.25, 'sawtooth', 0.18);
      vibrate([60, 40, 60]);
      popup('−2', idx, 'var(--stamp-red)');
    } else if (mole.type === 'golden') {
      score += 3;
      audio(1200, 0.1, 'square', 0.12);
      audio(1600, 0.12, 'square', 0.1);
      vibrate([15, 30, 15]);
      popup('+3', idx, 'var(--mustard)');
    } else {
      score += 1;
      audio(600 + (score % 8) * 60, 0.07, 'sine', 0.1);
      vibrate(12);
      popup('+1', idx, 'var(--olive)');
    }
    scoreEl.textContent = score;
  }

  function loop(t) {
    if (!alive) return;
    const elapsed = t - startedAt;
    const remaining = Math.max(0, GAME_LENGTH - elapsed);
    const secs = Math.ceil(remaining / 1000);
    timeEl.textContent = secs;
    timeEl.classList.toggle('warn', secs <= 10);

    // expire moles
    moles = moles.filter(m => {
      if (t >= m.until) { m.el.remove(); return false; }
      return true;
    });

    // ramp spawn rate over time
    spawnInterval = Math.max(400, 700 - elapsed * 0.005);
    if (t - lastSpawn > spawnInterval) {
      lastSpawn = t;
      spawnMole();
    }

    if (remaining <= 0) return gameOver();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    alive = false;
    moles.forEach(m => m.el.remove());
    moles = [];
    audio(300, 0.3, 'sawtooth', 0.15);
    setTimeout(() => audio(180, 0.4, 'sawtooth', 0.13), 150);
    vibrate([80, 60, 120]);

    const best = +(localStorage.getItem('whack_best') || 0);
    const isNew = score > best;
    if (isNew) localStorage.setItem('whack_best', score);
    goScoreEl.textContent = score;
    goBestEl.textContent = isNew ? score : best;
    newBestEl.classList.toggle('hidden', !isNew);
    const runs = +(localStorage.getItem('whack_runs') || 0) + 1;
    localStorage.setItem('whack_runs', runs);
    setTimeout(() => gameoverOverlay.classList.remove('hidden'), 350);
  }

  function start() {
    moles.forEach(m => m.el.remove());
    moles = [];
    score = 0;
    scoreEl.textContent = 0;
    timeEl.textContent = Math.ceil(GAME_LENGTH / 1000);
    timeEl.classList.remove('warn');
    alive = true;
    startedAt = performance.now();
    lastSpawn = 0;
    spawnInterval = 700;
    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
