<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f4ede0" />
<title>2048 · 数</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;700;800&family=Yuji+Boku&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f4ede0;
    --paper-2: #ece4d1;
    --paper-3: #e0d5bb;
    --ink: #1c1a16;
    --ink-soft: #3a352d;
    --faded: #8a7e6a;
    --rust: #c84a1d;
    --stamp-red: #b32d23;
    --mustard: #c69a2a;
    --olive: #6b6a3a;
    --teal: #2f6a6a;
    --rule: rgba(28,26,22,0.18);
    --f-display: 'RocknRoll One', system-ui, sans-serif;
    --f-mincho: 'Shippori Mincho', serif;
    --f-jp: 'Noto Sans JP', system-ui, sans-serif;
    --f-mono: 'JetBrains Mono', monospace;
    --f-brush: 'Yuji Boku', serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: var(--f-jp);
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 100; background: repeating-linear-gradient(0deg, rgba(28,26,22,0.04) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 101; background: radial-gradient(ellipse at center, transparent 55%, rgba(28,26,22,0.18) 100%); }

  #game {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at top, var(--paper) 0%, var(--paper-2) 100%);
    display: flex; flex-direction: column;
    align-items: center;
  }

  .top {
    position: absolute;
    top: env(safe-area-inset-top, 14px);
    left: 0; right: 0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
  }
  .stat { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.22em; color: var(--ink-soft); text-transform: uppercase; }
  .stat.right { text-align: right; }
  .stat .v { display: block; font-family: var(--f-mono); font-weight: 700; color: var(--ink); font-size: 1.5rem; letter-spacing: 0; line-height: 1; margin-top: 2px; }
  .stat .v.score { color: var(--rust); }

  .board {
    margin-top: 90px;
    padding: 10px;
    background: var(--paper-3);
    border: 1.5px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    width: min(88vw, 380px);
    height: min(88vw, 380px);
    position: relative;
    touch-action: none;
  }
  .cell {
    background: var(--paper-2);
    border: 1px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--f-display);
    font-size: 1.6rem;
    color: var(--ink);
    transition: background 0.12s;
    overflow: hidden;
  }
  .cell.t-0    { background: var(--paper-2); color: transparent; }
  .cell.t-2    { background: #efe3c8; }
  .cell.t-4    { background: #e8d59f; }
  .cell.t-8    { background: var(--mustard); color: var(--paper); }
  .cell.t-16   { background: #a8843a; color: var(--paper); }
  .cell.t-32   { background: var(--olive); color: var(--paper); }
  .cell.t-64   { background: var(--teal); color: var(--paper); }
  .cell.t-128  { background: var(--rust); color: var(--paper); font-size: 1.4rem; }
  .cell.t-256  { background: var(--rust); color: var(--paper); font-size: 1.4rem; }
  .cell.t-512  { background: var(--stamp-red); color: var(--paper); font-size: 1.3rem; }
  .cell.t-1024 { background: #7a1e16; color: var(--paper); font-size: 1.1rem; }
  .cell.t-2048 { background: var(--ink); color: var(--mustard); font-size: 1.1rem; box-shadow: inset 0 0 0 3px var(--mustard); }
  .cell.t-4096 { background: var(--ink); color: var(--stamp-red); font-size: 1rem; box-shadow: inset 0 0 0 3px var(--stamp-red); }
  .cell.bump { animation: bump 0.15s; }
  @keyframes bump {
    from { transform: scale(1); }
    50% { transform: scale(1.1); }
    to { transform: scale(1); }
  }
  .cell.new { animation: new-tile 0.18s; }
  @keyframes new-tile {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }

  .hint {
    margin-top: 18px;
    font-family: var(--f-mono);
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .overlay {
    position: absolute; inset: 0;
    background: var(--paper);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20; padding: 24px; text-align: center;
    transition: opacity 0.25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title-jp { font-family: var(--f-jp); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.32em; color: var(--faded); margin: 0 0 4px; }
  .title-en {
    font-family: var(--f-display);
    font-size: clamp(2.6rem, 12vw, 4rem);
    line-height: 0.9; color: var(--ink);
    margin: 0 0 8px; letter-spacing: -0.01em;
  }
  .title-en .kanji { font-family: var(--f-brush); color: var(--stamp-red); font-size: 0.8em; margin-left: 0.15em; }
  .tag-line { font-family: var(--f-mincho); font-style: italic; color: var(--ink-soft); font-size: 0.95rem; margin: 6px 0 18px; max-width: 280px; }
  .rules { color: var(--ink-soft); font-size: 0.85rem; max-width: 280px; margin: 0 0 20px; font-family: var(--f-mincho); }
  .btn { background: var(--rust); color: var(--paper); border: none; padding: 12px 36px; font-family: var(--f-display); font-size: 1.1rem; letter-spacing: 0.16em; text-transform: uppercase; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; transition: transform 0.1s; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .back-btn { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--ink); padding: 5px 12px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; margin-top: 14px; display: inline-block; }
  .go-receipt { border: 1px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 14px 18px; margin: 16px 0 20px; background: var(--paper); min-width: 240px; }
  .go-receipt .row { display: flex; align-items: baseline; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); line-height: 2; }
  .go-receipt .leader { flex: 1; border-bottom: 1px dotted var(--rule); margin: 0 8px; transform: translateY(-3px); }
  .go-receipt .val { font-weight: 700; color: var(--ink); font-size: 14px; }
  .new-best { color: var(--stamp-red); font-family: var(--f-display); font-size: 12px; letter-spacing: 0.3em; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="game">
  <div class="top">
    <div class="stat">
      <span>SCORE</span>
      <span class="v score" id="score">0</span>
    </div>
    <div class="stat right">
      <span>BEST</span>
      <span class="v" id="best">0</span>
    </div>
  </div>

  <div class="board" id="board"></div>
  <div class="hint">SWIPE TO MOVE</div>

  <div class="overlay" id="start">
    <div class="title-jp">数字 · NO. 09</div>
    <h1 class="title-en">2048<span class="kanji">数</span></h1>
    <div class="tag-line">slide · merge · reach 2048</div>
    <div class="rules">Swipe to slide all tiles. Tiles with the same number merge. Try to reach the 2048 tile.</div>
    <button class="btn" id="start-btn">START</button>
    <a href="../index.html" class="back-btn">← HUB</a>
  </div>

  <div class="overlay hidden" id="gameover">
    <div class="title-jp" id="go-title-jp" style="color: var(--stamp-red);">終 · GAME OVER</div>
    <h1 class="title-en" id="go-title-en" style="font-size: clamp(2rem, 9vw, 3rem);">GAME OVER<span class="kanji" style="color: var(--stamp-red);">終</span></h1>
    <div class="new-best hidden" id="new-best">★ NEW BEST</div>
    <div class="go-receipt">
      <div class="row"><span>Score</span><span class="leader"></span><span class="val" id="go-score">0</span></div>
      <div class="row"><span>Best</span><span class="leader"></span><span class="val" id="go-best" style="color: var(--rust);">0</span></div>
      <div class="row"><span>Max Tile</span><span class="leader"></span><span class="val" id="go-max" style="color: var(--teal);">0</span></div>
    </div>
    <button class="btn" id="retry-btn">TRY AGAIN</button>
    <a href="../index.html" class="back-btn">← HUB</a>
  </div>
</div>

<script>
(() => {
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('start');
  const gameoverOverlay = document.getElementById('gameover');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const goScoreEl = document.getElementById('go-score');
  const goBestEl = document.getElementById('go-best');
  const goMaxEl = document.getElementById('go-max');
  const goTitleJpEl = document.getElementById('go-title-jp');
  const goTitleEnEl = document.getElementById('go-title-en');
  const newBestEl = document.getElementById('new-best');

  const SIZE = 4;
  let board = [];
  let cells = [];
  let score = 0;
  let alive = false;

  function audio(freq, duration=0.1, type='sine', vol=0.1) { if(localStorage.getItem("settings_mute")==="1")return;
    try {
      const c = audio.ctx || (audio.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = c.createOscillator(); const gain = c.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + duration);
    } catch(e) {}
  }
  function vibrate(ms) { if(localStorage.getItem("settings_haptic_off")==="1")return; if (navigator.vibrate) navigator.vibrate(ms); }

  function buildCells() {
    boardEl.innerHTML = '';
    cells = [];
    for (let i = 0; i < SIZE * SIZE; i++) {
      const c = document.createElement('div');
      c.className = 'cell t-0';
      boardEl.appendChild(c);
      cells.push(c);
    }
  }

  function emptyBoard() {
    const b = [];
    for (let r = 0; r < SIZE; r++) {
      const row = [];
      for (let c = 0; c < SIZE; c++) row.push(0);
      b.push(row);
    }
    return b;
  }

  function spawnTile(animateNew = true) {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
    if (animateNew) {
      render();
      const idx = r * SIZE + c;
      cells[idx].classList.add('new');
      setTimeout(() => cells[idx].classList.remove('new'), 180);
    }
  }

  function render(bumpedIdxs = new Set()) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = board[r][c];
        const idx = r * SIZE + c;
        cells[idx].className = 'cell t-' + v;
        cells[idx].textContent = v === 0 ? '' : String(v);
        if (bumpedIdxs.has(idx)) {
          cells[idx].classList.add('bump');
          setTimeout((i) => cells[i].classList.remove('bump'), 150, idx);
        }
      }
    }
    scoreEl.textContent = score;
  }

  // slide+merge a single line to the LEFT, return {newLine, gained, mergedAt(indices in newLine)}
  function slide(line) {
    const arr = line.filter(v => v !== 0);
    const merged = [];
    let gained = 0;
    const mergedIdx = new Set();
    for (let i = 0; i < arr.length; i++) {
      if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
        const newVal = arr[i] * 2;
        merged.push(newVal);
        mergedIdx.add(merged.length - 1);
        gained += newVal;
        i++;
      } else {
        merged.push(arr[i]);
      }
    }
    while (merged.length < SIZE) merged.push(0);
    return { line: merged, gained, mergedIdx };
  }

  function move(dir) {
    if (!alive) return false;
    let moved = false;
    let totalGained = 0;
    const bumped = new Set();
    const snapshot = board.map(row => row.slice());

    if (dir === 'left') {
      for (let r = 0; r < SIZE; r++) {
        const res = slide(board[r]);
        board[r] = res.line;
        totalGained += res.gained;
        res.mergedIdx.forEach(c => bumped.add(r * SIZE + c));
      }
    } else if (dir === 'right') {
      for (let r = 0; r < SIZE; r++) {
        const reversed = board[r].slice().reverse();
        const res = slide(reversed);
        board[r] = res.line.reverse();
        totalGained += res.gained;
        res.mergedIdx.forEach(c => bumped.add(r * SIZE + (SIZE - 1 - c)));
      }
    } else if (dir === 'up') {
      for (let c = 0; c < SIZE; c++) {
        const col = [];
        for (let r = 0; r < SIZE; r++) col.push(board[r][c]);
        const res = slide(col);
        for (let r = 0; r < SIZE; r++) board[r][c] = res.line[r];
        totalGained += res.gained;
        res.mergedIdx.forEach(r => bumped.add(r * SIZE + c));
      }
    } else if (dir === 'down') {
      for (let c = 0; c < SIZE; c++) {
        const col = [];
        for (let r = SIZE - 1; r >= 0; r--) col.push(board[r][c]);
        const res = slide(col);
        for (let r = SIZE - 1, i = 0; r >= 0; r--, i++) board[r][c] = res.line[i];
        totalGained += res.gained;
        res.mergedIdx.forEach(r => bumped.add((SIZE - 1 - r) * SIZE + c));
      }
    }

    // detect movement
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (board[r][c] !== snapshot[r][c]) { moved = true; break; }
      }
      if (moved) break;
    }

    if (moved) {
      score += totalGained;
      if (totalGained > 0) {
        audio(500 + Math.min(800, Math.log2(totalGained) * 80), 0.08, 'sine', 0.1);
        vibrate(15);
      } else {
        audio(300, 0.04, 'square', 0.05);
      }
      render(bumped);
      spawnTile(true);
      if (isGameOver()) gameOver();
    }
    return moved;
  }

  function isGameOver() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] === 0) return false;
    // check possible merges
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (c + 1 < SIZE && board[r][c] === board[r][c + 1]) return false;
        if (r + 1 < SIZE && board[r][c] === board[r + 1][c]) return false;
      }
    }
    return true;
  }

  function maxTile() {
    let m = 0;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] > m) m = board[r][c];
    return m;
  }

  function gameOver() {
    alive = false;
    audio(200, 0.4, 'sawtooth', 0.16);
    setTimeout(() => audio(100, 0.5, 'sawtooth', 0.13), 150);
    vibrate([80, 60, 120]);
    const best = +(localStorage.getItem('numbers_best') || 0);
    const isNew = score > best;
    if (isNew) localStorage.setItem('numbers_best', score);
    const max = maxTile();
    const won = max >= 2048;
    if (won) {
      goTitleJpEl.style.color = 'var(--teal)';
      goTitleJpEl.textContent = '勝 · YOU WON';
      goTitleEnEl.innerHTML = 'YOU WIN<span class="kanji" style="color: var(--teal);">勝</span>';
    } else {
      goTitleJpEl.style.color = 'var(--stamp-red)';
      goTitleJpEl.textContent = '終 · GAME OVER';
      goTitleEnEl.innerHTML = 'GAME OVER<span class="kanji" style="color: var(--stamp-red);">終</span>';
    }
    goScoreEl.textContent = score;
    goBestEl.textContent = isNew ? score : best;
    goMaxEl.textContent = max;
    newBestEl.classList.toggle('hidden', !isNew);
    const runs = +(localStorage.getItem('numbers_runs') || 0) + 1;
    localStorage.setItem('numbers_runs', runs);
    setTimeout(() => gameoverOverlay.classList.remove('hidden'), 400);
  }

  function start() {
    buildCells();
    board = emptyBoard();
    score = 0;
    alive = true;
    spawnTile(false);
    spawnTile(false);
    render();
    bestEl.textContent = +(localStorage.getItem('numbers_best') || 0);
    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
  }

  // swipe
  let touchX = 0, touchY = 0, touching = false;
  boardEl.addEventListener('touchstart', (e) => {
    if (!alive) return;
    e.preventDefault();
    const t = e.touches[0];
    touchX = t.clientX; touchY = t.clientY;
    touching = true;
  }, { passive: false });
  boardEl.addEventListener('touchmove', (e) => {
    if (!touching) return;
    e.preventDefault();
    const t = e.touches[0];
    const dx = t.clientX - touchX;
    const dy = t.clientY - touchY;
    if (Math.abs(dx) > 24 || Math.abs(dy) > 24) {
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
      touching = false;
    }
  }, { passive: false });
  boardEl.addEventListener('touchend', () => { touching = false; });

  // mouse drag fallback (desktop)
  let mouseX = 0, mouseY = 0, mousing = false;
  boardEl.addEventListener('mousedown', (e) => {
    if (!alive) return;
    mouseX = e.clientX; mouseY = e.clientY;
    mousing = true;
  });
  window.addEventListener('mousemove', (e) => {
    if (!mousing) return;
    const dx = e.clientX - mouseX;
    const dy = e.clientY - mouseY;
    if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
      else move(dy > 0 ? 'down' : 'up');
      mousing = false;
    }
  });
  window.addEventListener('mouseup', () => { mousing = false; });

  // keyboard
  window.addEventListener('keydown', (e) => {
    if (!alive) return;
    if (['ArrowLeft','a','A'].includes(e.key)) { e.preventDefault(); move('left'); }
    else if (['ArrowRight','d','D'].includes(e.key)) { e.preventDefault(); move('right'); }
    else if (['ArrowUp','w','W'].includes(e.key)) { e.preventDefault(); move('up'); }
    else if (['ArrowDown','s','S'].includes(e.key)) { e.preventDefault(); move('down'); }
  });

  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);
  buildCells();
  bestEl.textContent = +(localStorage.getItem('numbers_best') || 0);
})();
</script>
</body>
</html>
