<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a14" />
<title>STACK</title>
<style>
  :root {
    --bg: #0a0a14;
    --text: #ffffff;
    --muted: #888aa0;
    --accent: #00e5ff;
    --perfect: #ffea00;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overscroll-behavior: none;
  }
  body { position: fixed; inset: 0; }

  #game {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #1a1a3a 0%, #0a0a14 100%);
    cursor: pointer;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }

  .top {
    position: absolute;
    top: env(safe-area-inset-top, 12px);
    left: 0; right: 0;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 5;
    pointer-events: none;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat.right { align-items: flex-end; }
  .stat .label { font-size: 0.65rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .stat .value { font-size: 1.6rem; font-weight: 800; line-height: 1; }
  .value.score { color: var(--accent); text-shadow: 0 0 12px currentColor; }

  .perfect-flash {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--perfect);
    text-shadow: 0 0 20px currentColor;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.2s, transform 0.2s;
  }
  .perfect-flash.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .hint {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    animation: hint-pulse 1.2s infinite alternate;
  }
  @keyframes hint-pulse { from { opacity: 0.4; } to { opacity: 1; } }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(4px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20; padding: 24px; text-align: center;
    transition: opacity 0.25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-size: clamp(2.8rem, 13vw, 4.8rem);
    font-weight: 900; letter-spacing: -2px; margin: 0;
    background: linear-gradient(135deg, var(--accent), var(--perfect));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 0.9;
  }
  .tagline {
    color: var(--muted); margin: 12px 0 24px;
    font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase;
  }
  .btn {
    background: linear-gradient(135deg, var(--accent), var(--perfect));
    color: #000; border: none; padding: 14px 40px;
    border-radius: 60px; font-size: 1.1rem; font-weight: 900;
    cursor: pointer; letter-spacing: 2px; text-transform: uppercase;
    box-shadow: 0 8px 30px rgba(0,229,255,0.4);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.95); }
  .back-btn {
    background: rgba(0,0,0,0.6); color: var(--muted);
    border: 1px solid #2a2a44; padding: 6px 14px;
    border-radius: 16px; font-size: 0.7rem; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    text-decoration: none; margin-top: 12px;
  }
  .go-stats {
    margin: 16px 0 22px;
    display: flex; gap: 28px;
  }
  .go-stats .l { color: var(--muted); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; }
  .go-stats .v { font-size: 2.2rem; font-weight: 900; }
  .new-best { color: var(--perfect); font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase; animation: pulse 0.8s infinite alternate; margin-bottom: 8px; }
  @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div class="top">
    <div class="stat">
      <div class="label">Height</div>
      <div class="value score" id="score">0</div>
    </div>
    <div class="stat right">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>
  </div>
  <div class="perfect-flash" id="perfect">PERFECT</div>
  <div class="hint" id="hint">TAP TO DROP</div>

  <div class="overlay" id="start">
    <h1 class="title">STACK</h1>
    <div class="tagline">tap to drop · keep aligned</div>
    <button class="btn" id="start-btn">START</button>
    <a href="../index.html" class="back-btn">← Hub</a>
  </div>

  <div class="overlay hidden" id="gameover">
    <h1 class="title" style="font-size: clamp(1.8rem, 8vw, 3rem);">GAME<br/>OVER</h1>
    <div class="new-best hidden" id="new-best">NEW BEST</div>
    <div class="go-stats">
      <div><div class="l">Height</div><div class="v" id="go-score">0</div></div>
      <div><div class="l">Best</div><div class="v" id="go-best" style="color: var(--accent);">0</div></div>
    </div>
    <button class="btn" id="retry-btn">TRY AGAIN</button>
    <a href="../index.html" class="back-btn">← Hub</a>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  const gameEl = document.getElementById('game');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('start');
  const gameoverOverlay = document.getElementById('gameover');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const goScoreEl = document.getElementById('go-score');
  const goBestEl = document.getElementById('go-best');
  const newBestEl = document.getElementById('new-best');
  const perfectFlash = document.getElementById('perfect');
  const hintEl = document.getElementById('hint');

  let W, H, blockH = 36;
  let stack; // array of {x, w, color}
  let current; // {x, w, dir, color, speed}
  let alive = false;
  let score = 0;
  let cameraY = 0;
  let targetCameraY = 0;
  let lastFrame = 0;
  let falling = []; // pieces falling off

  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function audio(freq, duration=0.1, type='sine', vol=0.1) {
    try {
      const c = audio.ctx || (audio.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, c.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(); osc.stop(c.currentTime + duration);
    } catch(e) {}
  }
  function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

  function colorForHeight(h) {
    const hue = (200 + h * 8) % 360;
    return `hsl(${hue}, 70%, 55%)`;
  }

  function newCurrent() {
    const last = stack[stack.length - 1];
    const fromLeft = Math.random() < 0.5;
    current = {
      x: fromLeft ? -last.w : W,
      w: last.w,
      color: colorForHeight(stack.length),
      dir: fromLeft ? 1 : -1,
      speed: Math.min(0.6, 0.25 + stack.length * 0.012),
    };
  }

  function drop() {
    if (!alive) return;
    const last = stack[stack.length - 1];
    const overlapLeft = Math.max(current.x, last.x);
    const overlapRight = Math.min(current.x + current.w, last.x + last.w);
    const overlap = overlapRight - overlapLeft;

    if (overlap <= 0) {
      // total miss
      falling.push({...current, vy: 0});
      return gameOver();
    }

    const cutLeftAmount = overlapLeft - current.x;
    const cutRightAmount = (current.x + current.w) - overlapRight;
    const perfectThreshold = 4;
    const isPerfect = Math.abs(current.x - last.x) < perfectThreshold;

    if (isPerfect) {
      // perfect: snap, no cut, grow back slightly
      current.x = last.x;
      current.w = Math.min(last.w + 4, W * 0.85);
      perfectFlash.classList.add('show');
      audio(1200, 0.12, 'square', 0.12);
      audio(1600, 0.1, 'square', 0.1);
      vibrate([20, 30, 20]);
      setTimeout(() => perfectFlash.classList.remove('show'), 350);
    } else {
      // cut off the non-overlapping piece, drop it
      if (cutLeftAmount > 0) {
        falling.push({ x: current.x, y: yForLevel(stack.length), w: cutLeftAmount, color: current.color, vy: 0, vx: -0.15 });
      }
      if (cutRightAmount > 0) {
        falling.push({ x: overlapRight, y: yForLevel(stack.length), w: cutRightAmount, color: current.color, vy: 0, vx: 0.15 });
      }
      current.x = overlapLeft;
      current.w = overlap;
      audio(500, 0.08, 'square', 0.1);
      vibrate(15);
    }

    stack.push({ x: current.x, w: current.w, color: current.color });
    score++;
    scoreEl.textContent = score;

    if (current.w < 8) {
      return gameOver();
    }

    targetCameraY = Math.max(0, (stack.length - 6) * blockH);
    newCurrent();
    if (hintEl.style.opacity !== '0') hintEl.style.opacity = '0';
  }

  function yForLevel(level) {
    return H - 80 - level * blockH;
  }

  function loop(t) {
    const dt = Math.min(50, t - lastFrame);
    lastFrame = t;

    if (alive && current) {
      current.x += current.speed * current.dir * dt;
      if (current.x + current.w > W && current.dir > 0) current.dir = -1;
      if (current.x < 0 && current.dir < 0) current.dir = 1;
    }

    // camera ease
    cameraY += (targetCameraY - cameraY) * 0.08;

    // update falling pieces
    for (const f of falling) {
      f.vy += 0.001 * dt;
      f.y += f.vy * dt;
      if (f.vx) f.x += f.vx * dt;
    }
    falling = falling.filter(f => f.y < H + 200);

    draw();
    requestAnimationFrame(loop);
  }

  function draw() {
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, W, H);

    // gradient background based on height
    const bgHue = (200 + stack.length * 6) % 360;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `hsla(${bgHue}, 60%, 18%, 1)`);
    grad.addColorStop(1, '#0a0a14');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // stack
    for (let i = 0; i < stack.length; i++) {
      const b = stack[i];
      const y = yForLevel(i) + cameraY;
      if (y > H + 40 || y < -40) continue;
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 8;
      ctx.fillRect(b.x, y, b.w, blockH - 2);
    }
    ctx.shadowBlur = 0;

    // current
    if (current && alive) {
      const y = yForLevel(stack.length) + cameraY;
      ctx.fillStyle = current.color;
      ctx.shadowColor = current.color;
      ctx.shadowBlur = 14;
      ctx.fillRect(current.x, y, current.w, blockH - 2);
      ctx.shadowBlur = 0;
    }

    // falling pieces
    for (const f of falling) {
      ctx.fillStyle = f.color;
      ctx.globalAlpha = Math.max(0, 1 - (f.y - yForLevel(stack.length)) / H);
      ctx.fillRect(f.x, f.y + cameraY, f.w, blockH - 2);
      ctx.globalAlpha = 1;
    }
  }

  function gameOver() {
    alive = false;
    audio(150, 0.4, 'sawtooth', 0.16);
    setTimeout(() => audio(80, 0.4, 'sawtooth', 0.13), 150);
    vibrate([80, 60, 120]);
    const best = +(localStorage.getItem('stack_best') || 0);
    const isNew = score > best;
    if (isNew) localStorage.setItem('stack_best', score);
    goScoreEl.textContent = score;
    goBestEl.textContent = isNew ? score : best;
    newBestEl.classList.toggle('hidden', !isNew);
    const runs = +(localStorage.getItem('stack_runs') || 0) + 1;
    localStorage.setItem('stack_runs', runs);
    setTimeout(() => gameoverOverlay.classList.remove('hidden'), 400);
  }

  function start() {
    fit();
    stack = [];
    const baseW = W * 0.55;
    stack.push({ x: (W - baseW) / 2, w: baseW, color: colorForHeight(0) });
    score = 0;
    scoreEl.textContent = 0;
    bestEl.textContent = +(localStorage.getItem('stack_best') || 0);
    cameraY = 0;
    targetCameraY = 0;
    falling = [];
    newCurrent();
    alive = true;
    lastFrame = performance.now();
    hintEl.style.opacity = '';
    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  gameEl.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.overlay') || e.target.closest('.back-btn') || e.target.closest('.btn')) return;
    if (alive) drop();
  });

  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);
  window.addEventListener('resize', fit);

  bestEl.textContent = +(localStorage.getItem('stack_best') || 0);
  fit();
})();
</script>
</body>
</html>
