<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a14" />
<title>TAP HARD</title>
<style>
  :root {
    --bg: #0a0a14;
    --bg2: #1a1a2e;
    --good: #00e676;
    --rare: #ffea00;
    --epic: #00e5ff;
    --bomb: #ff1744;
    --text: #ffffff;
    --muted: #888aa0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    inset: 0;
  }
  #game {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top, #1a1a3a 0%, #0a0a14 60%, #000 100%);
    overflow: hidden;
  }
  .hud {
    position: absolute;
    top: env(safe-area-inset-top, 12px);
    left: 0;
    right: 0;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
    pointer-events: none;
  }
  .hud-left, .hud-right { display: flex; flex-direction: column; gap: 4px; }
  .hud-right { align-items: flex-end; }
  .label { font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .value { font-size: 1.6rem; font-weight: 800; line-height: 1; }
  .lives { font-size: 1.4rem; letter-spacing: 4px; }
  .combo {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1rem;
    font-weight: 700;
    color: var(--rare);
    opacity: 0;
    transition: opacity 0.2s;
    text-shadow: 0 0 12px var(--rare);
    z-index: 10;
    pointer-events: none;
  }
  .combo.show { opacity: 1; }

  .target {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 900;
    cursor: pointer;
    will-change: transform;
    transition: transform 0.08s;
  }
  .target.good {
    background: radial-gradient(circle at 30% 30%, #66ffa6, var(--good));
    box-shadow: 0 0 20px var(--good), inset 0 0 12px rgba(255,255,255,0.3);
  }
  .target.rare {
    background: radial-gradient(circle at 30% 30%, #fff59d, var(--rare));
    box-shadow: 0 0 24px var(--rare), inset 0 0 12px rgba(255,255,255,0.3);
  }
  .target.epic {
    background: radial-gradient(circle at 30% 30%, #84ffff, var(--epic));
    box-shadow: 0 0 30px var(--epic), inset 0 0 12px rgba(255,255,255,0.3);
    animation: epic-pulse 0.6s infinite alternate;
  }
  @keyframes epic-pulse {
    from { transform: scale(1); }
    to { transform: scale(1.08); }
  }
  .target.bomb {
    background: radial-gradient(circle at 30% 30%, #ff6b6b, var(--bomb));
    box-shadow: 0 0 24px var(--bomb), inset 0 0 12px rgba(0,0,0,0.4);
    color: #fff;
  }
  .target.popped {
    pointer-events: none;
    animation: pop 0.3s ease-out forwards;
  }
  @keyframes pop {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(2.2); opacity: 0; }
  }

  .popup {
    position: absolute;
    font-size: 1.2rem;
    font-weight: 900;
    pointer-events: none;
    animation: float-up 0.7s ease-out forwards;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    z-index: 5;
  }
  @keyframes float-up {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-60px); opacity: 0; }
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, rgba(10,10,30,0.95) 0%, rgba(0,0,0,0.98) 100%);
    z-index: 20;
    padding: 24px;
    text-align: center;
    transition: opacity 0.3s;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-size: clamp(3rem, 14vw, 5.5rem);
    font-weight: 900;
    letter-spacing: -2px;
    background: linear-gradient(135deg, var(--epic), var(--rare), var(--bomb));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
    line-height: 0.9;
    text-shadow: 0 0 60px rgba(255,234,0,0.3);
  }
  .tagline {
    color: var(--muted);
    margin: 12px 0 40px;
    font-size: 0.95rem;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 24px;
    margin: 0 0 32px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
  .dot.good { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .dot.rare { background: var(--rare); box-shadow: 0 0 8px var(--rare); }
  .dot.epic { background: var(--epic); box-shadow: 0 0 8px var(--epic); }
  .dot.bomb { background: var(--bomb); box-shadow: 0 0 8px var(--bomb); }

  .btn {
    background: linear-gradient(135deg, var(--epic), var(--good));
    color: #000;
    border: none;
    padding: 18px 48px;
    border-radius: 60px;
    font-size: 1.2rem;
    font-weight: 900;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 8px 30px rgba(0,229,255,0.4);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.95); }

  .gameover-stats {
    margin: 20px 0 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  .gameover-stats .stat-label { font-size: 0.75rem; color: var(--muted); letter-spacing: 2px; }
  .gameover-stats .stat-value { font-size: 2.6rem; font-weight: 900; }
  .new-high {
    color: var(--rare);
    font-size: 0.9rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: pulse 0.8s infinite alternate;
  }
  @keyframes pulse {
    from { opacity: 0.6; }
    to { opacity: 1; }
  }

  .shake { animation: shake 0.2s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-4px,2px); }
    50% { transform: translate(4px,-2px); }
    75% { transform: translate(-2px,4px); }
  }
</style>
</head>
<body>
<div id="game">
  <div class="hud">
    <div class="hud-left">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="hud-right">
      <div class="label">Lives</div>
      <div class="value lives" id="lives">♥♥♥</div>
    </div>
  </div>
  <div class="combo" id="combo">x2 COMBO</div>

  <div class="screen" id="start-screen">
    <h1 class="title">TAP<br/>HARD</h1>
    <div class="tagline">don't touch the bombs</div>
    <div class="legend">
      <div class="row"><span class="dot good"></span> +10</div>
      <div class="row"><span class="dot rare"></span> +25</div>
      <div class="row"><span class="dot epic"></span> +100</div>
      <div class="row"><span class="dot bomb"></span> AVOID</div>
    </div>
    <button class="btn" id="start-btn">START</button>
  </div>

  <div class="screen hidden" id="gameover-screen">
    <h1 class="title" style="font-size: clamp(2rem, 9vw, 3.5rem);">GAME<br/>OVER</h1>
    <div class="gameover-stats">
      <div>
        <div class="stat-label">Score</div>
        <div class="stat-value" id="final-score">0</div>
      </div>
      <div>
        <div class="stat-label">Best</div>
        <div class="stat-value" id="best-score" style="color: var(--rare);">0</div>
      </div>
      <div class="new-high hidden" id="new-high">NEW HIGH SCORE</div>
    </div>
    <button class="btn" id="retry-btn">TRY AGAIN</button>
  </div>
</div>

<script>
(() => {
  const game = document.getElementById('game');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const comboEl = document.getElementById('combo');
  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const finalScoreEl = document.getElementById('final-score');
  const bestScoreEl = document.getElementById('best-score');
  const newHighEl = document.getElementById('new-high');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');

  const state = {
    running: false,
    score: 0,
    lives: 3,
    combo: 0,
    targets: [],
    spawnTimer: 0,
    spawnInterval: 900,
    elapsed: 0,
    lastFrame: 0,
    fallSpeed: 0.12,
  };

  const TARGET_SIZE = 64;

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function audioBeep(freq, duration, type='sine', vol=0.1) {
    try {
      const ctx = audioBeep.ctx || (audioBeep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  function spawnTarget() {
    const roll = Math.random();
    let type, points;
    if (roll < 0.10) { type = 'bomb'; points = 0; }
    else if (roll < 0.15) { type = 'epic'; points = 100; }
    else if (roll < 0.40) { type = 'rare'; points = 25; }
    else { type = 'good'; points = 10; }

    const size = type === 'epic' ? TARGET_SIZE - 8 : TARGET_SIZE;
    const x = rand(8, window.innerWidth - size - 8);
    const el = document.createElement('div');
    el.className = 'target ' + type;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = x + 'px';
    el.style.top = -size + 'px';
    if (type === 'bomb') el.textContent = '✕';
    else if (type === 'epic') el.textContent = '★';

    const speed = state.fallSpeed * (type === 'epic' ? 1.6 : type === 'rare' ? 1.25 : 1);

    const target = { el, type, points, x, y: -size, size, speed, alive: true };
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      onTap(target);
    });
    game.appendChild(el);
    state.targets.push(target);
  }

  function popup(text, x, y, color) {
    const el = document.createElement('div');
    el.className = 'popup';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.color = color;
    game.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }

  function showCombo() {
    if (state.combo >= 3) {
      comboEl.textContent = `x${state.combo} COMBO`;
      comboEl.classList.add('show');
      clearTimeout(showCombo.t);
      showCombo.t = setTimeout(() => comboEl.classList.remove('show'), 800);
    }
  }

  function onTap(target) {
    if (!target.alive || !state.running) return;
    target.alive = false;
    target.el.classList.add('popped');
    setTimeout(() => target.el.remove(), 300);

    if (target.type === 'bomb') {
      loseLife();
      state.combo = 0;
      audioBeep(120, 0.3, 'sawtooth', 0.2);
      vibrate([60, 40, 60]);
      popup('BOOM', target.x, target.y, 'var(--bomb)');
      game.classList.add('shake');
      setTimeout(() => game.classList.remove('shake'), 200);
    } else {
      state.combo++;
      const mult = state.combo >= 3 ? Math.min(5, Math.floor(state.combo / 3) + 1) : 1;
      const gained = target.points * mult;
      state.score += gained;
      scoreEl.textContent = state.score;
      const color = target.type === 'epic' ? 'var(--epic)' : target.type === 'rare' ? 'var(--rare)' : 'var(--good)';
      popup(`+${gained}`, target.x, target.y, color);
      const freq = target.type === 'epic' ? 1200 : target.type === 'rare' ? 800 : 600;
      audioBeep(freq, 0.1, 'sine', 0.08);
      vibrate(15);
      showCombo();
    }
  }

  function loseLife() {
    state.lives--;
    livesEl.textContent = '♥'.repeat(Math.max(0, state.lives)) + '·'.repeat(3 - Math.max(0, state.lives));
    if (state.lives <= 0) gameOver();
  }

  function loop(t) {
    if (!state.running) return;
    const dt = Math.min(50, t - state.lastFrame);
    state.lastFrame = t;
    state.elapsed += dt;

    state.fallSpeed = 0.12 + (state.elapsed / 1000) * 0.006;
    state.spawnInterval = Math.max(280, 900 - state.elapsed * 0.08);

    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnInterval) {
      state.spawnTimer = 0;
      spawnTarget();
    }

    const h = window.innerHeight;
    for (const tgt of state.targets) {
      if (!tgt.alive) continue;
      tgt.y += tgt.speed * dt;
      tgt.el.style.top = tgt.y + 'px';
      if (tgt.y > h) {
        tgt.alive = false;
        tgt.el.remove();
        if (tgt.type !== 'bomb') {
          loseLife();
          state.combo = 0;
          audioBeep(200, 0.15, 'triangle', 0.1);
          vibrate(40);
        }
      }
    }
    state.targets = state.targets.filter(t => t.alive);

    requestAnimationFrame(loop);
  }

  function start() {
    state.running = true;
    state.score = 0;
    state.lives = 3;
    state.combo = 0;
    state.targets.forEach(t => t.el.remove());
    state.targets = [];
    state.spawnTimer = 0;
    state.spawnInterval = 900;
    state.elapsed = 0;
    state.fallSpeed = 0.12;
    state.lastFrame = performance.now();
    scoreEl.textContent = '0';
    livesEl.textContent = '♥♥♥';
    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state.running = false;
    state.targets.forEach(t => t.el.remove());
    state.targets = [];
    const best = +(localStorage.getItem('taphard_best') || 0);
    const isNew = state.score > best;
    if (isNew) localStorage.setItem('taphard_best', state.score);
    finalScoreEl.textContent = state.score;
    bestScoreEl.textContent = isNew ? state.score : best;
    newHighEl.classList.toggle('hidden', !isNew);
    gameoverScreen.classList.remove('hidden');
    audioBeep(300, 0.2, 'sawtooth', 0.15);
    setTimeout(() => audioBeep(150, 0.4, 'sawtooth', 0.15), 150);
    vibrate([100, 50, 100, 50, 200]);
  }

  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);

  bestScoreEl.textContent = localStorage.getItem('taphard_best') || '0';
})();
</script>
</body>
</html>
